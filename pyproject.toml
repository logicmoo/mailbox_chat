[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mailbox-mailbox-relay-bridging-proxy"
version = "0.1.0"
description = "A durable mailbox and chat-mailbox relay bridging proxy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0",
  "requests>=2.32",
  "websocket-client>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mailbox-server = "mailbox_mailboxs.server:main"
mailbox-client = "mailbox_mailboxs.agent_mailbox:main"
mailbox-console = "mailbox_mailboxs.console_client:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mailbox_mailboxs = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
